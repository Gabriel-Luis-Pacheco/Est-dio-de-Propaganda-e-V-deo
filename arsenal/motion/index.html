<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Motion studies</title><style>body{background:#f4f1e9;color:#18352e;font:16px system-ui;margin:32px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}article{min-width:0}svg{width:100%;height:auto;display:block}button{font:inherit}small{display:block;margin:8px 0}</style><h1>Motion studies / Creative Studio OS</h1><p>Deterministic building blocks, not finished advertisements. Click a study to replay.</p><main id="grid"></main><script type="module">import{recipes,frame}from './mechanisms.mjs';const grid=document.querySelector('#grid');for(const [id,r] of Object.entries(recipes)){const a=document.createElement('article'),title=document.createElement('h2'),meta=document.createElement('small'),v=document.createElement('div'),b=document.createElement('button');title.textContent=id;meta.textContent=r.why+' • avoid: '+r.avoid;v.innerHTML=frame(id,.65);b.textContent='Replay';let run=0;b.onclick=()=>{const token=++run,start=performance.now();function tick(now){if(token!==run)return;const t=Math.min(1,(now-start)/1800);v.innerHTML=frame(id,t);if(t<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)};a.append(v,title,meta,b);grid.append(a)}</script></html>
