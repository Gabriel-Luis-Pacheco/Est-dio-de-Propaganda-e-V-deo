name: Skill structural validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python tests/test_pacing.py
      - run: python tests/test_timeline.py
      - run: python scripts/validate-timeline.py templates/timeline.json
      - run: python -m py_compile scripts/analyze-library.py scripts/inspect-video.py scripts/analyze-pacing.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python tests/test_stage_gate.py
      - run: python tests/test_release_hardened.py
      - run: python -m py_compile scripts/stage-gate.py scripts/release-gate.py
      - run: python -m py_compile scripts/creative-audit.py scripts/run-render.py
      - run: python tests/test_creative_audit.py
